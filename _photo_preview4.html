.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 1500px; margin: 0 auto;}
.cell { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #2D6A4F;}
.cell img { width: 100%; height: 100%; object-fit: cover; display: block;}
.cell::after {
  content: attr(data-id);
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.85);
  padding: 4px 8px;
  font-size: 9px;
  color: white;
}
h1 { font-family: sans-serif; font-size: 16px; margin-bottom: 16px;}
.section { font-family: sans-serif; font-size: 13px; opacity: 0.7; margin: 20px 0 8px; color: #E9C46A;}
</style></head>
